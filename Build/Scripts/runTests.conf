# Per-extension settings for the shared test runner. See runTests.conf.dist in
# netresearch/typo3-ci-workflows for everything that can go here.
#
# Nothing needs pinning: the PHPUnit, PHPStan, Rector and php-cs-fixer configs
# all sit where detection looks. What follows are the three browser-side suites
# the shared runner has no equivalent for, so these extend rather than override.
# CI covers the same ground in its own `browser` job; these exist so one command
# does locally what that job does remotely.

# Type-check the TypeScript sources.
suite_typecheck() {
    npm run typecheck
}

# Browser unit tests (vitest).
suite_javascript() {
    npm run test:js "$@"
}

# Rebuild the distributables and fail if the committed ones differ. The check is
# the `git diff`, not the build: it catches a source change that was never
# rebuilt, which is invisible until someone loads the extension.
suite_assets() {
    npm run build
    npm run build:css
    git diff --exit-code -- Resources/Public
}
