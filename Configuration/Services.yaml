services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Netresearch\NrBrowserAi\:
    resource: '../Classes/*'

  # FormEngine instantiates the itemsProcFunc class of the form selector through
  # GeneralUtility::makeInstance, which only reaches the container for public
  # services; without this the processor is built without its dependency.
  Netresearch\NrBrowserAi\Backend\FormItemsProcessor:
    public: true
