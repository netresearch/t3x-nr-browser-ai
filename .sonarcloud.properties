# SonarCloud automatic analysis configuration.
#
# Resources/Public/JavaScript/Assistant.js is the esbuild bundle of everything in
# Resources/Private/TypeScript, and Resources/Public/Css/Assistant.css is a copy
# of Resources/Private/Styles. TYPO3 extensions ship built frontend assets, so
# both files stay committed and are verified against their sources in CI.
#
# Analysing them reports every source line twice — the bundle alone produced
# 31.7% duplicated new code — and raises generated-code findings such as `var`
# from the esbuild output. Exclude the generated copies; the sources they are
# built from remain fully analysed.
sonar.exclusions=Resources/Public/JavaScript/**,Resources/Public/Css/**,public/**,.Build/**
