<section
    data-nr-browser-ai-root
    data-context-selector="{contextSelector -> f:format.htmlspecialchars()}"
    data-context-usage-limit="{contextUsageLimit}"
    data-system-prompt="{systemPrompt -> f:format.htmlspecialchars()}"
    data-supplemental-instruction="{supplementalInstruction -> f:format.htmlspecialchars()}"
>
    <div data-nr-browser-ai-fallback>
        <f:comment>
            Trust boundary: fallbackContent is rendered by TYPO3's CONTENT object from an enabled tt_content record.
            Only this server-rendered value may bypass Fluid escaping; model output must never use format.raw.
        </f:comment>
        <f:format.raw>{fallbackContent}</f:format.raw>
    </div>
    <div data-nr-browser-ai-assistant hidden>
        <f:if condition="{title}"><h2>{title}</h2></f:if>
        <f:if condition="{introduction}"><p>{introduction}</p></f:if>
        <p data-nr-browser-ai-status role="status"></p>
        <button type="button" data-nr-browser-ai-setup>Set up browser AI</button>
        <progress data-nr-browser-ai-progress max="1" value="0">
            Browser AI model download
        </progress>
        <div data-nr-browser-ai-log aria-live="polite"></div>
        <form data-nr-browser-ai-form>
            <label>
                Your question
                <input type="text" data-nr-browser-ai-question autocomplete="off" required />
            </label>
            <button type="submit" data-nr-browser-ai-submit>Ask</button>
        </form>
        <button type="button" data-nr-browser-ai-abort>Stop response</button>
        <button type="button" data-nr-browser-ai-reset>Reset conversation</button>
        <button type="button" data-nr-browser-ai-retry>Retry</button>
    </div>
</section>
